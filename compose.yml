# =====================================================================
# Kafka MultiSink — единый стенд
#
#   Генератор ──> orders  ──[Kafka Connect / JDBC Sink]──> PostgreSQL
#            └──> events  ──[Kafka Connect / S3 Sink  ]──> MinIO
#            └──> metrics ──[ClickHouse Kafka engine  ]──> ClickHouse
#
# Все три топика — Avro, схемы регистрируются в Schema Registry.
# =====================================================================

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:8.1.0
  environment: &kafka-common-env
    CLUSTER_ID: ZETVJENWRjaECDUEExP_eg
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
    # Служебные топики реплицируем на все три брокера
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    # В учебном стенде не ждём 3 секунды перед первым ребалансом
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

services:

  # ===================================================================
  # KAFKA (KRaft, 3 ноды: каждая одновременно broker + controller)
  # ===================================================================
  kafka-0:
    <<: *kafka-common
    container_name: kafka-0
    hostname: kafka-0
    ports:
      - "29092:29092"
    volumes:
      - kafka-0-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 0
      KAFKA_LISTENERS: INTERNAL://:9091,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-0:9091,EXTERNAL://localhost:29092
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9091"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "29093:29092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9091,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9091,EXTERNAL://localhost:29093
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9091"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "29094:29092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9091,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9091,EXTERNAL://localhost:29094
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9091"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ===================================================================
  # СОЗДАНИЕ ТОПИКОВ
  # Один раз отрабатывает и завершается. Остальные сервисы ждут его.
  # ===================================================================
  kafka-init:
    image: confluentinc/cp-kafka:8.1.0
    container_name: kafka-init
    depends_on:
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  # ===================================================================
  # SCHEMA REGISTRY
  # ===================================================================
  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.0
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-0:9091,kafka-1:9091,kafka-2:9091
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: none
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ===================================================================
  # ГЕНЕРАТОР СИНТЕТИКИ
  # Пишет во все три топика в Avro, схемы регистрирует сам.
  # ===================================================================
  generator:
    build: ./generator
    image: kafka-multisink-generator:1.0.0
    container_name: generator
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka-0:9091,kafka-1:9091,kafka-2:9091
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TOPIC_ORDERS: orders
      TOPIC_EVENTS: events
      TOPIC_METRICS: metrics
      # Пауза между «тиками» генерации, секунд
      GEN_INTERVAL_SEC: ${GEN_INTERVAL_SEC:-2}
      # Сколько записей каждого вида отправлять за один тик
      GEN_ORDERS_PER_TICK: ${GEN_ORDERS_PER_TICK:-3}
      GEN_EVENTS_PER_TICK: ${GEN_EVENTS_PER_TICK:-10}
      GEN_METRICS_PER_TICK: ${GEN_METRICS_PER_TICK:-20}
      # 0 = работать бесконечно, иначе — остановиться после N тиков
      GEN_MAX_TICKS: ${GEN_MAX_TICKS:-0}
    restart: unless-stopped

  # ===================================================================
  # KAFKA CONNECT (S3 Sink + JDBC Sink в одном воркере)
  # ===================================================================
  kafka-connect:
    build: ./connect
    image: kafka-multisink-connect:1.0.0
    container_name: kafka-connect
    hostname: kafka-connect
    depends_on:
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka-0:9091,kafka-1:9091,kafka-2:9091
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ===================================================================
  # РЕГИСТРАЦИЯ КОННЕКТОРОВ
  # Отрабатывает один раз, конфиги лежат в ./connectors/*.json
  # ===================================================================
  register-connectors:
    image: curlimages/curl:latest
    container_name: register-connectors
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./connectors:/connectors:ro
      - ./scripts/register-connectors.sh:/register-connectors.sh:ro
    entrypoint: ["sh", "/register-connectors.sh"]
    restart: "no"

  # ===================================================================
  # ПРИЁМНИК 1 — POSTGRESQL (топик orders)
  # ===================================================================
  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kafka_sink}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    depends_on:
      - postgres
    ports:
      - "5050:5050"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: "False"

  # ===================================================================
  # ПРИЁМНИК 2 — MINIO (топик events)
  # ===================================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web-консоль
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio-create-bucket:
    image: minio/mc
    container_name: minio-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done;
        mc mb myminio/kafka-events --ignore-existing;
        echo 'Bucket kafka-events готов';
      "
    restart: "no"

  # ===================================================================
  # ПРИЁМНИК 3 — CLICKHOUSE (топик metrics)
  # Читает Kafka напрямую через движок Kafka, без Kafka Connect.
  #
  # ВНИМАНИЕ к версии образа. Kafka 4.x (а cp-kafka:8.1.0 — это она)
  # убрала старые версии протокольных API согласно KIP-896. Сборки
  # ClickHouse со старым форком librdkafka на такой брокер уже не
  # встают: сообщения читаются, но offset'ы не коммитятся, и всё
  # уезжает в отбраковку с ошибкой
  #     Local: Required feature not supported by broker
  # Внешне это выглядит как пустая таблица metrics при живом топике.
  # Поэтому нужен свежий образ ClickHouse. Тег ниже стоит закрепить
  # на конкретной версии — посмотрите свою через SELECT version().
  # ===================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    hostname: clickhouse
    depends_on:
      schema-registry:
        condition: service_healthy
    ports:
      - "8123:8123"   # HTTP
      - "9002:9000"   # native (9000 занят MinIO)
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-kafka_sink}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ===================================================================
  # ИНСТРУМЕНТЫ
  # ===================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    hostname: kafka-ui
    depends_on:
      schema-registry:
        condition: service_healthy
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-0:9091,kafka-1:9091,kafka-2:9091
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  rest-proxy:
    image: confluentinc/cp-kafka-rest:8.1.0
    container_name: rest-proxy
    hostname: rest-proxy
    depends_on:
      schema-registry:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      KAFKA_REST_HOST_NAME: rest-proxy
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
      KAFKA_REST_BOOTSTRAP_SERVERS: kafka-0:9091,kafka-1:9091,kafka-2:9091
      KAFKA_REST_SCHEMA_REGISTRY_URL: http://schema-registry:8081

volumes:
  kafka-0-data:
  kafka-1-data:
  kafka-2-data:
  postgres-data:
  minio-data:
  clickhouse-data:
